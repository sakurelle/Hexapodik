[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hexapod-control"
version = "0.1.0"
description = "Raspberry Pi controller for the Hexapodik robot"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hexapodctl = "hexapod.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
